[project]
name = "prompt-engineering-seminar"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "vllm==0.31.0",
    "torch",
    "torchvision",
    "torchaudio",
    "torchcodec",
    "openai>=2.25",
    "transformers>=5.10",
    "numpy",
    "pandas",
    "matplotlib",
    "jupyterlab>=4",
    "ipykernel",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.31.0/vllm-0.31.0+cpu-cp38-abi3-manylinux_2_39_x86_64.whl" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
